name: Xbox One Fat - UWP SM5.1 build and signed diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xbox-one-uwp.yml'
      - 'CMakePresets.json'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'tools/xbox/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# New pushes supersede older source snapshots. Run only the newest UWP build,
# avoiding unnecessary full MSVC rebuilds while retaining CPM source cache.
concurrency:
  group: one-eden-xbox-one-uwp-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    # Rebuild the C++ objects directly using MSVC. The first sccache/GHA run
    # stalled in OpenSSL's external nmake build; keep the proven toolchain while
    # caching only CPM dependency sources.
    steps:
      - name: Checkout original Eden source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore CMake CPM source cache
        id: cpm-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/cpm
          key: cpmsrc-win2022-uwp-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'CMakeModules/**/*.cmake', 'externals/CMakeLists.txt') }}
          restore-keys: |
            cpmsrc-win2022-uwp-v1-

      - name: Inspect Windows UWP toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) { throw 'Visual Studio Installer / vswhere not found' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'VS2022 C++ toolset missing' }
          Write-Host "VS root: $vs"
          $uwp = & $vswhere -latest -products * -requires Microsoft.VisualStudio.ComponentGroup.UWP.VC -property installationPath
          Write-Host "UWP C++ component: $(if ($uwp) {'present'} else {'not detected'})"
          foreach ($cmd in 'cmake', 'ninja', 'perl', 'nasm', 'glslangValidator', 'glslang') {
            $found = Get-Command $cmd -ErrorAction SilentlyContinue
            Write-Host "${cmd}: $(if ($found) {$found.Source} else {'missing'})"
          }
          cmake --version

      - name: Install native build utilities
        shell: pwsh
        run: |
          choco install nasm strawberryperl -y --no-progress --limit-output

      - name: Install and verify glslang shader compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/KhronosGroup/glslang/releases/download/16.6.0/glslang-16.6.0-windows-x86_64-release.zip'
          $expected = '82bf434e69b9bb4829de7e2b4bc2c5e7a7861e53d66cf75e5cc70f5f694a8d9b'
          $zip = Join-Path $env:RUNNER_TEMP 'glslang.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'glslang-unpack'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "glslang release hash mismatch: $actual" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $binary = Get-ChildItem $dir -Filter glslangValidator.exe -Recurse -File |
            Select-Object -First 1
          if (!$binary) {
            $binary = Get-ChildItem $dir -Filter glslang.exe -Recurse -File |
              Select-Object -First 1
          }
          if (!$binary) { throw 'Missing glslang executable in verified release ZIP' }
          $bin = Join-Path $env:RUNNER_TEMP 'glslang-bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          Copy-Item $binary.FullName (Join-Path $bin 'glslangValidator.exe')
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'glslangValidator.exe') --version

      - name: Configure UWP x64 for AppContainer
        shell: cmd
        run: call tools\xbox\build-env.bat cmake --preset uwp-x64

      # Save downloaded dependency sources before C++ compilation: even a failed
      # compiler/linker stage should not force a full dependency download again.
      - name: Save CPM source cache for next build
        if: steps.cpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/cpm
          key: cpmsrc-win2022-uwp-v1-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json', 'CMakeModules/**/*.cmake', 'externals/CMakeLists.txt') }}

      - name: Build Eden UWP frontend
        shell: cmd
        run: call tools\xbox\build-env.bat cmake --build --preset uwp-x64 --target eden-uwp --parallel 2

      - name: Upload unsigned diagnostic EXE (not an installable package)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eden-uwp-x64-unsigned-diagnostic
          path: |
            build-uwp/bin/eden-uwp.exe
            build-uwp/bin/*.dll
          if-no-files-found: error
          retention-days: 7

      # Xbox One Fat reports SM5.1 and loads D3DCompiler/DXBC directly.
      # Mesa's spirv_to_dxil.dll/dxil.dll are only needed by the separate
      # SM6/DXIL route, not for this verified original-Xbox-One backend.
      # Do not download legacy build artifacts from the old repository.
      - name: Build Xbox One SM5.1 diagnostic APPX with graphics probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/xbox/package-appx.ps1 -Variant diagnostic -Library -Profile on -ShaderModelProbe -PackageVersion "0.2.88.$env:GITHUB_RUN_NUMBER" `
            -BuildDir build-uwp -OutDir 'build-uwp/package/sm5probe'
          if (!(Test-Path 'build-uwp/package/sm5probe/eden-xbox-diagnostic.appx')) {
            throw 'Missing Xbox One SM5.1 diagnostic APPX'
          }

      - name: Verify DXBC SM5 graphics probe and complete UWP APPX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $file = (Resolve-Path 'build-uwp/package/sm5probe/eden-xbox-diagnostic.appx').Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($file)
          try {
            $items = @($zip.Entries | ForEach-Object FullName)
            foreach ($name in @('eden-uwp.exe', 'eden_probe_vs.cso',
                                 'eden_probe_ps.cso', 'AppxManifest.xml')) {
              if ($items -notcontains $name) { throw "Missing $name from Xbox One diagnostic APPX" }
            }
            $manifestEntry = $zip.GetEntry('AppxManifest.xml')
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try { [xml]$packedManifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $expectedVersion = "0.2.88.$env:GITHUB_RUN_NUMBER"
            if ($packedManifest.Package.Identity.Version -ne $expectedVersion) {
              throw "APPX identity version incorrect: expected $expectedVersion"
            }
          } finally { $zip.Dispose() }
          Write-Host "Xbox One SM5.1 diagnostic APPX complete and signed: $((Get-FileHash $file).Hash)"
          Write-Host 'This APPX uses SPIRV-Cross -> HLSL -> DXBC. It does not require the old Mesa DXIL translator.'

      # A separate normal Game package for 2D performance comparisons. This
      # uses the same compiled shaders but omits the in-process sampling profiler
      # requested by -Profile on in the diagnostic package.
      - name: Package Xbox One normal Game mode without profiling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./tools/xbox/package-appx.ps1 -Variant normal -Library -ShaderModelProbe -PackageVersion "0.2.88.$env:GITHUB_RUN_NUMBER" `
            -BuildDir build-uwp -OutDir 'build-uwp/package/gameplay'
          if (!(Test-Path 'build-uwp/package/gameplay/eden-xbox-normal.appx')) {
            throw 'Missing Xbox One normal APPX'
          }

      - name: Upload normal Xbox One 2D Game package
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Xbox-OneFat-Gameplay-NoProfiler-APPX
          path: |
            build-uwp/package/gameplay/eden-xbox-normal.appx
            build-uwp/package/gameplay/eden-xbox.cer
            build-uwp/package/gameplay/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
          retention-days: 14

      - name: Upload installable Xbox One Shader Model probe diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: Eden-Xbox-OneFat-SM5-DXBC-Orientation-Fix-APPX
          path: |
            build-uwp/package/sm5probe/eden-xbox-diagnostic.appx
            build-uwp/package/sm5probe/eden-xbox.cer
            build-uwp/package/sm5probe/Microsoft.VCLibs.x64.14.00.appx
          if-no-files-found: error
          retention-days: 14
